<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LTX — The world model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --retake-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --retake-slow-ease: cubic-bezier(0.65, 0, 0.35, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow-x: hidden;
      background: #000;
      color: #fff;
      font-family: 'Manrope', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      font-family: 'Manrope', system-ui, sans-serif;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.2);
    }

    :focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    /* ══════════════════════════════════════════════════════════════════
       4. STRUCTURE + LAYERS
       ══════════════════════════════════════════════════════════════════ */
    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    /* All eight videos */
    .media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
      visibility: hidden;
    }

    /* ══════════════════════════════════════════════════════════════════
       5. HEADER
       ══════════════════════════════════════════════════════════════════ */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      padding: calc(58px + env(safe-area-inset-top)) 40px 40px;
      text-shadow: 0 1px 6px rgb(0 0 0 / 0.18);
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .logo-link {
      display: flex;
      align-items: center;
      color: #fff;
      text-decoration: none;
    }

    .navbar-logo {
      height: 24px;
      width: auto;
      display: block;
    }

    .meta {
      display: inline-flex;
      align-items: center;
      margin-left: clamp(48px, 5vw, 70px);
      gap: clamp(28px, 3vw, 44px);
      font-size: 18px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .try-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 152px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgb(255 255 255 / 0.75);
      background: transparent;
      color: #fff;
      font-size: 18px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.04em;
      text-decoration: none;
      cursor: pointer;
      transition: color 300ms var(--retake-ease), background 300ms var(--retake-ease), border-color 300ms var(--retake-ease);
    }

    .try-btn:hover,
    .try-btn:focus-visible {
      background: #fff;
      color: #0b1a26;
      border-color: #fff;
    }

    /* ══════════════════════════════════════════════════════════════════
       6. HERO COPY
       ══════════════════════════════════════════════════════════════════ */
    .hero {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .hero h1 {
      position: absolute;
      top: 35.9%;
      left: 50%;
      transform: translateX(-50%);
      width: min(901px, calc(100vw - 48px));
      font-size: clamp(62px, 6.8vw, 100px);
      font-weight: 500;
      line-height: 0.8;
      letter-spacing: -0.04em;
      white-space: nowrap;
      text-shadow: 0 2px 12px rgb(0 0 0 / 0.14);
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 0.28em;
    }

    .hero h1 span {
      display: inline-block;
      opacity: 1;
      filter: blur(0px);
      transform: translateY(0);
      transition: opacity 900ms var(--retake-ease), filter 900ms var(--retake-ease), transform 900ms var(--retake-ease);
    }

    .hero h1 span:nth-child(1) { transition-delay: 0ms; }
    .hero h1 span:nth-child(2) { transition-delay: 90ms; }
    .hero h1 span:nth-child(3) { transition-delay: 180ms; }

    .stage.title-hidden .hero h1 span {
      opacity: 0;
      filter: blur(12px);
      transform: translateY(-10px);
    }

    .hero p {
      position: absolute;
      top: calc(46.78% + 94px);
      left: 50%;
      transform: translateX(-50%);
      width: min(734px, calc(100vw - 48px));
      font-size: clamp(14px, 1.25vw, 18px);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.04em;
      text-shadow: 0 1px 8px rgb(0 0 0 / 0.16);
      text-align: center;
    }

    /* ══════════════════════════════════════════════════════════════════
       7 & 8. CONTROLLER & GLASS MATERIAL
       ══════════════════════════════════════════════════════════════════ */
    .controller {
      position: absolute;
      top: 46.78%;
      left: 50%;
      transform: translateX(-50%);
      width: min(880px, calc(100vw - 48px));
      height: 72px;
      z-index: 20;
      --cap-left: -5px;
      --cap-width: calc(20% + 5px);
      --glass-x: 24%;
      --glass-y: 8%;
    }

    .glass {
      position: absolute;
      overflow: hidden;
    }

    .glass::before,
    .glass::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    /* ::before — broad soft highlight, peak alpha <= 0.25 */
    .glass::before {
      background:
        radial-gradient(120% 150% at var(--glass-x, 24%) var(--glass-y, 8%),
                        rgb(255 255 255 / 0.25), rgb(255 255 255 / 0) 53%),
        linear-gradient(115deg, rgb(255 255 255 / 0.10), rgb(255 255 255 / 0) 42%);
    }

    /* ::after — masked 1px perimeter */
    .glass::after {
      padding: 1px;
      background: conic-gradient(from 225deg, #7fe3ff, rgb(255 255 255 / 0.35), #ffffff,
                                 #ffd7e6, rgb(255 255 255 / 0.35), #7fe3ff);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
              mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
    }

    /* Rear track */
    .track {
      top: 4px;
      left: 0;
      width: 100%;
      height: 64px;
      border-radius: 999px;
      pointer-events: none;
      background: rgb(24 55 82 / 0.31);
      border: 1px solid rgb(255 255 255 / 0.2);
      -webkit-backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
      backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
      box-shadow:
        0 14px 38px rgb(4 24 43 / 0.16),
        0 2px 7px rgb(4 24 43 / 0.1),
        inset 1px 1px 0 rgb(255 255 255 / 0.48),
        inset -1px -1px 0 rgb(21 49 73 / 0.14),
        inset 0 0 0 0.5px rgb(255 255 255 / 0.16);
      opacity: 1;
      transition: left 980ms var(--retake-slow-ease), width 980ms var(--retake-slow-ease), opacity 600ms var(--retake-ease);
    }

    .track::after {
      opacity: 0.27;
    }

    /* Foreground capsule */
    .capsule {
      top: -1px;
      height: 72px;
      border-radius: 999px;
      left: var(--cap-left, -5px);
      width: var(--cap-width, calc(20% + 5px));
      pointer-events: none;
      background: rgb(246 251 255 / 0.24);
      border: 1px solid rgb(255 255 255 / 0.28);
      -webkit-backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
      backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
      box-shadow:
        0 11px 28px rgb(4 24 43 / 0.17),
        0 2px 6px rgb(4 24 43 / 0.1),
        inset 1px 1px 0 rgb(255 255 255 / 0.62),
        inset -1px -1px 0 rgb(20 49 73 / 0.18),
        inset 0 0 12px rgb(255 255 255 / 0.055);
      transition: left 620ms var(--retake-ease), width 620ms var(--retake-ease), background 620ms var(--retake-ease), opacity 420ms var(--retake-ease);
    }

    .capsule::after {
      opacity: 0.30;
    }

    /* Controller collapse states */
    .controller.collapsed .capsule {
      left: calc(50% - 100px);
      width: 200px;
      background: rgb(246 251 255 / 0.14);
      transition: left 980ms var(--retake-slow-ease), width 980ms var(--retake-slow-ease), background 980ms var(--retake-slow-ease);
    }

    .controller.collapsed .track {
      left: calc(50% - 96px);
      width: 192px;
    }

    .controller.track-faded .track {
      opacity: 0;
      transition: left 980ms var(--retake-slow-ease), width 980ms var(--retake-slow-ease), opacity 400ms linear 650ms;
    }

    /* Grid Cells */
    .cells {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 0 14px;
      font-size: 23px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.04em;
      white-space: nowrap;
      font-family: inherit;
      color: #fff;
      background: transparent;
      border: 0;
      border-radius: 999px;
      opacity: 1;
      filter: blur(0px);
      transform: translate(0, 0) scale(1);
      transition: opacity 760ms var(--retake-ease) 60ms, filter 760ms var(--retake-ease) 60ms, transform 760ms var(--retake-ease) 60ms;
      -webkit-user-select: none;
      user-select: none;
    }

    .btn-cell {
      cursor: pointer;
    }

    .btn-cell:disabled {
      cursor: default;
    }

    .label-cell {
      cursor: default;
      transition: opacity 300ms var(--retake-ease), filter 420ms var(--retake-ease), transform 980ms var(--retake-slow-ease);
    }

    .controller.has-highlight .label-cell {
      opacity: 0.5;
    }

    .controller.collapsed .cell {
      transition: opacity 420ms var(--retake-ease), filter 420ms var(--retake-ease), transform 980ms var(--retake-slow-ease);
    }

    .cell.is-faded {
      opacity: 0;
      filter: blur(10px);
      transform: scale(0.94);
      pointer-events: none;
    }

    @keyframes resetReveal {
      0% {
        opacity: 0;
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
      }
    }

    .cell.is-reset {
      animation: resetReveal 520ms var(--retake-ease) forwards;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      cursor: pointer;
      z-index: 5;
    }

    /* ══════════════════════════════════════════════════════════════════
       NOTICE & LIVE REGION
       ══════════════════════════════════════════════════════════════════ */
    .notice-banner {
      position: absolute;
      top: calc(58px + env(safe-area-inset-top) + 64px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 22px;
      border-radius: 999px;
      background: rgb(24 55 82 / 0.85);
      border: 1px solid rgb(255 255 255 / 0.3);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 14px;
      letter-spacing: -0.02em;
    }

    .notice-banner[hidden] {
      display: none;
    }

    .notice-retry {
      background: #fff;
      color: #0b1a26;
      border: 0;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 200ms ease;
    }

    .notice-retry:hover {
      opacity: 0.9;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ══════════════════════════════════════════════════════════════════
       12. RESPONSIVE
       ══════════════════════════════════════════════════════════════════ */
    @media (max-width: 900px) {
      header {
        padding: calc(24px + env(safe-area-inset-top)) 24px 24px;
      }
      .meta {
        font-size: 14px;
        gap: 22px;
        margin-left: 34px;
      }
      .try-btn {
        width: 116px;
        height: 36px;
        font-size: 14px;
      }
      .cell {
        font-size: clamp(17px, 2.5vw, 24px);
      }
    }

    @media (max-width: 700px) {
      header {
        padding-left: 18px;
        padding-right: 18px;
      }
      .navbar-logo {
        height: 21px;
      }
      .meta {
        font-size: 12px;
      }
      .meta-sub {
        display: none;
      }
      .try-btn {
        width: 92px;
        height: 34px;
        font-size: 13px;
      }
      .try-btn::after {
        content: "";
        position: absolute;
        inset: -6px -10px;
      }
      .hero h1 {
        top: 34%;
        width: calc(100vw - 40px);
        font-size: clamp(48px, 14vw, 64px);
        line-height: 0.88;
        white-space: normal;
        flex-wrap: wrap;
      }
      .hero p {
        top: 77%;
        width: calc(100vw - 44px);
        font-size: 14px;
      }
      .controller {
        top: 53%;
        width: calc(100vw - 40px);
        height: 156px;
      }
      .track {
        top: 0;
        height: 156px;
        border-radius: 28px;
      }
      .cells {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: 48px 54px 54px;
      }
      .label-cell {
        grid-column: 1 / -1;
        border-bottom: 1px solid rgb(255 255 255 / 0.12);
      }
      #btn-scene {
        border-bottom: 1px solid rgb(255 255 255 / 0.12);
        border-right: 1px solid rgb(255 255 255 / 0.12);
      }
      #btn-light {
        border-bottom: 1px solid rgb(255 255 255 / 0.12);
      }
      #btn-clothing {
        border-right: 1px solid rgb(255 255 255 / 0.12);
      }
      .cell {
        font-size: 17px;
      }
      .btn-cell:active,
      .btn-cell:focus-visible {
        outline-offset: -3px;
      }
      .capsule {
        opacity: 0;
        pointer-events: none;
      }
      .controller.collapsed .cell {
        border: 0 !important;
      }
      .controller.collapsed .capsule {
        opacity: 1;
        left: 50%;
        top: 4vh;
        top: 4dvh;
        transform: translate(-50%, -50%);
        width: 196px;
        height: 64px;
        border-radius: 999px;
        background: rgb(246 251 255 / 0.18);
      }
    }

    @media (max-width: 700px) and (max-height: 700px) {
      .controller {
        top: 50%;
      }
      .hero p {
        top: calc(50% + 168px);
        width: calc(100vw - 32px);
        font-size: 13px;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .hero h1 {
        top: 20%;
        font-size: clamp(34px, 8vh, 56px);
      }
      .controller {
        top: 50%;
      }
      .hero p {
        top: auto;
        bottom: 8px;
        font-size: 13px;
      }
    }

    @media (max-width: 700px) and (max-height: 520px) and (orientation: landscape) {
      .hero h1 {
        top: 12%;
        font-size: clamp(28px, 7vh, 44px);
      }
      .controller {
        top: 46%;
        height: 118px;
      }
      .track {
        height: 118px;
      }
      .cells {
        grid-template-rows: 36px 41px 41px;
      }
      .cell {
        font-size: 15px;
      }
      .hero p {
        bottom: 6px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .capsule, .track, .cell, .hero h1 span, .try-btn, .btn-cell {
        transition-duration: 1ms !important;
        transition-delay: 0s !important;
        animation-duration: 1ms !important;
        animation-delay: 0s !important;
        filter: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- 8 Persistent Video Elements -->
    <video id="vid-clothing-fwd" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video id="vid-clothing-rev" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video id="vid-scene-fwd" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video id="vid-scene-rev" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video id="vid-light-fwd" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video id="vid-light-rev" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video id="vid-cast-fwd" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video id="vid-cast-rev" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>

    <!-- Hero Copy -->
    <div class="hero">
      <h1 id="hero-title">
        <span>The</span> <span>world</span> <span>model</span>
      </h1>
      <p id="hero-desc">
        LTX builds open world models that give you full control, from production-grade video to systems that understand and operate in the physical world.
      </p>
    </div>

    <!-- Controller -->
    <div class="controller" id="controller" role="group" aria-label="Scene state controller">
      <div class="track glass" aria-hidden="true"></div>
      <div class="capsule glass" aria-hidden="true"></div>
      <div class="cells">
        <div class="cell label-cell" id="label-select-state">Select state &rarr;</div>
        <button type="button" class="cell btn-cell" id="btn-scene" data-branch="scene" data-index="1" disabled aria-disabled="true">Scene</button>
        <button type="button" class="cell btn-cell" id="btn-light" data-branch="light" data-index="2" disabled aria-disabled="true">Lighting</button>
        <button type="button" class="cell btn-cell" id="btn-clothing" data-branch="clothing" data-index="3" disabled aria-disabled="true">Clothing</button>
        <button type="button" class="cell btn-cell" id="btn-cast" data-branch="cast" data-index="4" disabled aria-disabled="true">Cast</button>
      </div>
    </div>

    <!-- Header -->
    <header>
      <div class="header-left">
        <a href="https://ltx.io/" target="_blank" rel="noopener noreferrer" class="logo-link" aria-label="LTX home">

    <div id="status-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script>
    (function() {
      'use strict';

      // ══════════════════════════════════════════════════════════════════
      // DOM Elements
      // ══════════════════════════════════════════════════════════════════
      var stageEl = document.getElementById('stage');
      var controllerEl = document.getElementById('controller');
      var liveRegionEl = document.getElementById('status-live');
      var noticeEl = document.getElementById('notice');
      var noticeTextEl = document.getElementById('notice-text');
      var noticeRetryBtn = document.getElementById('notice-retry-btn');
      var allCells = controllerEl.querySelectorAll('.cell');
      var allButtons = controllerEl.querySelectorAll('.btn-cell');

      // ══════════════════════════════════════════════════════════════════
      // Configuration & State Machine Definitions
      // ══════════════════════════════════════════════════════════════════
      var branches = {
        clothing: {
          name: 'Clothing',
          fwdId: 'vid-clothing-fwd',
          revId: 'vid-clothing-rev',
          btnId: 'btn-clothing',
          duration: 2.08,
          revDuration: 2.08,
          holdGuardFwd: 0.08,
          holdGuardRev: 0.08,
          fwdReady: false,
          revReady: false
        },
        scene: {
          name: 'Scene',
          fwdId: 'vid-scene-fwd',
          revId: 'vid-scene-rev',
          btnId: 'btn-scene',
          duration: 2.08,
          revDuration: 2.08,
          holdGuardFwd: 0.08,
          holdGuardRev: 0.18, // Verified Scene REVERSE hold guard
          fwdReady: false,
          revReady: false
        },
        light: {
          name: 'Lighting',
          fwdId: 'vid-light-fwd',
          revId: 'vid-light-rev',
          btnId: 'btn-light',
          duration: 2.08,
          revDuration: 2.04,
          holdGuardFwd: 0.08,
          holdGuardRev: 0.08,
          fwdReady: false,
          revReady: false
        },
        cast: {
          name: 'Cast',
          fwdId: 'vid-cast-fwd',
          revId: 'vid-cast-rev',
          btnId: 'btn-cast',
          duration: 3.00,
          revDuration: 2.48,
          holdGuardFwd: 0.08,
          holdGuardRev: 0.08,
          fwdReady: false,
          revReady: false
        }
      };

      var currentState = 'base'; // 'base' | branch key
      var isLocked = false;
      var currentToken = 0;
      var currentVisibleVideo = null;
      var activeBranch = null;
      var activeBtn = null;
      var lastFailedTransition = null;
      var isCollapsed = false;

      var hoveredIndex = -1;
      var focusedIndex = -1;

      // ══════════════════════════════════════════════════════════════════
      // Live Announcer
      // ══════════════════════════════════════════════════════════════════
      function announce(msg) {
        if (!liveRegionEl) return;
        liveRegionEl.textContent = '';
        setTimeout(function() {
          liveRegionEl.textContent = msg;
        }, 50);
      }

      // ══════════════════════════════════════════════════════════════════
      // Pointer & Highlight Mechanics
      // ══════════════════════════════════════════════════════════════════
      controllerEl.addEventListener('pointermove', function(e) {
        var rect = controllerEl.getBoundingClientRect();
        var x = ((e.clientX - rect.left) / rect.width) * 100;
        var y = ((e.clientY - rect.top) / rect.height) * 100;
        controllerEl.style.setProperty('--glass-x', x.toFixed(1) + '%');
        controllerEl.style.setProperty('--glass-y', y.toFixed(1) + '%');
      });

      function setCapsuleIndex(idx) {
        if (idx === 0) {
          controllerEl.style.setProperty('--cap-left', '-5px');
          controllerEl.style.setProperty('--cap-width', 'calc(20% + 5px)');
        } else if (idx === 1) {
          controllerEl.style.setProperty('--cap-left', '20%');
          controllerEl.style.setProperty('--cap-width', '20%');
        } else if (idx === 2) {
          controllerEl.style.setProperty('--cap-left', '40%');
          controllerEl.style.setProperty('--cap-width', '20%');
        } else if (idx === 3) {
          controllerEl.style.setProperty('--cap-left', '60%');
          controllerEl.style.setProperty('--cap-width', '20%');
        } else if (idx === 4) {
          controllerEl.style.setProperty('--cap-left', '80%');
          controllerEl.style.setProperty('--cap-width', 'calc(20% + 5px)');
        }
      }

      function updateCapsuleHighlight() {
        if (isCollapsed) return;
        var idx = (hoveredIndex !== -1) ? hoveredIndex : (focusedIndex !== -1 ? focusedIndex : 0);
        setCapsuleIndex(idx);
        if (idx > 0) {
          controllerEl.classList.add('has-highlight');
        } else {
          controllerEl.classList.remove('has-highlight');
        }
      }

      controllerEl.addEventListener('pointerleave', function() {
        if (isCollapsed) return;
        hoveredIndex = -1;
        updateCapsuleHighlight();
      });

      for (var bi = 0; bi < allButtons.length; bi++) {
        (function(btn) {
          var idx = parseInt(btn.getAttribute('data-index'), 10);
          btn.addEventListener('pointerenter', function() {
            if (isCollapsed) return;
            hoveredIndex = idx;
            updateCapsuleHighlight();
          });
          btn.addEventListener('pointerleave', function() {
            if (isCollapsed) return;
            hoveredIndex = -1;
            updateCapsuleHighlight();
          });
          btn.addEventListener('focus', function() {
            if (isCollapsed) return;
            focusedIndex = idx;
            updateCapsuleHighlight();
          });
          btn.addEventListener('blur', function() {
            if (isCollapsed) return;
            focusedIndex = -1;
            updateCapsuleHighlight();
          });
        })(allButtons[bi]);
      }

      // ══════════════════════════════════════════════════════════════════
      // Label Target Geometry Calculation
      // ══════════════════════════════════════════════════════════════════
      function getChosenOffset(btn) {
        var controllerRect = controllerEl.getBoundingClientRect();
        var isMobile = window.innerWidth <= 700;
        var targetCenterX, targetCenterY;

        if (isMobile) {
          targetCenterX = controllerRect.left + (controllerRect.width / 2);
          targetCenterY = controllerRect.top + (window.innerHeight * 0.04);
        } else {
          targetCenterX = controllerRect.left + (controllerRect.width / 2);
          targetCenterY = controllerRect.top - 1 + 36;
        }

        var btnRect = btn.getBoundingClientRect();
        var btnCenterX = btnRect.left + (btnRect.width / 2);
        var btnCenterY = btnRect.top + (btnRect.height / 2);

        return {
          dx: targetCenterX - btnCenterX,
          dy: targetCenterY - btnCenterY
        };
      }

      window.addEventListener('resize', function() {
        if (isCollapsed && activeBtn) {
          activeBtn.style.transition = 'none';
          var offset = getChosenOffset(activeBtn);
          activeBtn.style.transform = 'translate(' + Math.round(offset.dx) + 'px, ' + Math.round(offset.dy) + 'px)';
          void activeBtn.offsetWidth;
          activeBtn.style.transition = '';
        }
      });

      // ══════════════════════════════════════════════════════════════════
      // Seam-Safe Video Player Primitives
      // ══════════════════════════════════════════════════════════════════
      function prepareTargetVideo(video, token) {
        return new Promise(function(resolve, reject) {
          if (token !== currentToken) {
            reject(new Error('Stale transition token'));
            return;
          }
          if (video.currentTime <= 0.001) {
            resolve();
            return;
          }
          var onSeeked = function() {
            video.removeEventListener('seeked', onSeeked);
            if (token === currentToken) {
              resolve();
            } else {
              reject(new Error('Stale transition token'));
            }
          };
          video.addEventListener('seeked', onSeeked);
          video.currentTime = 0;
        });
      }

      function waitForDecodedFrame(video, token) {
        var cleanupFn = null;
        var promise = new Promise(function(resolve, reject) {
          if (token !== currentToken) {
            reject(new Error('Stale transition token'));
            return;
          }

          if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
            var rvfcId = null;
            var onFrame = function(now, metadata) {
              if (token !== currentToken) return;
              if (metadata && metadata.mediaTime <= 0.5 && video.readyState >= 2) {
                resolve();
              } else {
                rvfcId = video.requestVideoFrameCallback(onFrame);
              }
            };
            rvfcId = video.requestVideoFrameCallback(onFrame);
            cleanupFn = function() {
              if (rvfcId !== null && 'cancelVideoFrameCallback' in video) {
                video.cancelVideoFrameCallback(rvfcId);
              }
            };
          } else {
            var raf1 = null;
            var raf2 = null;
            var onPlaying = function() {
              video.removeEventListener('playing', onPlaying);
              if (token !== currentToken) return;
              raf1 = requestAnimationFrame(function() {
                if (token !== currentToken) return;
                raf2 = requestAnimationFrame(function() {
                  if (token !== currentToken) return;
                  if (video.readyState >= 2) {
                    resolve();
                  }
                });
              });
            };

            if (!video.paused && video.readyState >= 2) {
              onPlaying();
            } else {
              video.addEventListener('playing', onPlaying);
            }

            cleanupFn = function() {
              video.removeEventListener('playing', onPlaying);
              if (raf1) cancelAnimationFrame(raf1);
              if (raf2) cancelAnimationFrame(raf2);
            };
          }
        });

        return {
          promise: promise,
          cancel: function() {
            if (cleanupFn) cleanupFn();
          }
        };
      }

      function createPausableTimeout(video, onTimeout, durationMs) {
        var remaining = durationMs;
        var startTime = Date.now();
        var timerId = null;
        var isPaused = false;
        var isDone = false;

        function onTick() {
          if (isDone) return;
          isDone = true;
          cleanup();
          onTimeout();
        }

        function startTimer() {
          startTime = Date.now();
          timerId = setTimeout(onTick, remaining);
        }

        function pauseTimer() {
          if (timerId) {
            clearTimeout(timerId);
            timerId = null;
          }
          var elapsed = Date.now() - startTime;
          remaining = Math.max(0, remaining - elapsed);
        }

        function onVisibilityChange() {
          if (isDone) return;
          if (document.hidden) {
            isPaused = true;
            pauseTimer();
            try {
              video.pause();
              video.currentTime = 0;
            } catch (e) {}
          } else {
            if (isPaused) {
              isPaused = false;
              startTimer();
              try {
                var p = video.play();
                if (p && typeof p.catch === 'function') {
                  p.catch(function() {});
                }
              } catch (e) {}
            }
          }
        }

        document.addEventListener('visibilitychange', onVisibilityChange);
        startTimer();

        function cleanup() {
          isDone = true;
          if (timerId) {
            clearTimeout(timerId);
            timerId = null;
          }
          document.removeEventListener('visibilitychange', onVisibilityChange);
        }

        return {
          clear: cleanup
        };
      }

      function monitorPlayback(video, defaultDuration, holdGuard, token, onHoldReached) {
        var videoDuration = (video.duration && !isNaN(video.duration) && video.duration > 0.5) ? video.duration : defaultDuration;
        var holdTime = Math.max(0, videoDuration - holdGuard);
        var endedCalled = false;
        var rafId = null;

        function triggerHold() {
          if (endedCalled) return;
          endedCalled = true;
          cleanup();
          if (token === currentToken) {
            try {
              video.pause();
            } catch (e) {}
            onHoldReached();
          }
        }

        function onEnded() {
          triggerHold();
        }

        video.addEventListener('ended', onEnded);

        function checkFrame() {
          if (endedCalled || token !== currentToken) {
            cleanup();
            return;
          }
          if (video.duration && !isNaN(video.duration) && video.duration > 0.5) {
            holdTime = Math.max(0, video.duration - holdGuard);
          }
          if (video.currentTime >= holdTime) {
            triggerHold();
            return;
          }
          rafId = requestAnimationFrame(checkFrame);
        }

        rafId = requestAnimationFrame(checkFrame);

        function cleanup() {
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          video.removeEventListener('ended', onEnded);
        }

        return {
          cancel: cleanup
        };
      }

      // ══════════════════════════════════════════════════════════════════
      // Transition Choreography & Execution
      // ══════════════════════════════════════════════════════════════════
      function runTransition(branchKey, direction) {
        var branchData = branches[branchKey];
        if (!branchData) return;

        // Step 1: Capture unique transition token & synchronously lock input
        var token = ++currentToken;
        isLocked = true;

        for (var b = 0; b < allButtons.length; b++) {
          allButtons[b].disabled = true;
          allButtons[b].setAttribute('aria-disabled', 'true');
        }

        if (noticeEl) noticeEl.hidden = true;

        var targetVideoId = (direction === 'forward') ? branchData.fwdId : branchData.revId;
        var targetVideo = document.getElementById(targetVideoId);
        var previousVideo = currentVisibleVideo;

        var hadFocus = false;
        var originatingBtn = document.getElementById(branchData.btnId);

        if (direction === 'forward') {
          activeBranch = branchKey;
          activeBtn = originatingBtn;
          hadFocus = (document.activeElement === originatingBtn);

          // Collapse controller and fade rear track in the exact same recalc
          isCollapsed = true;
          controllerEl.classList.remove('has-highlight');
          controllerEl.classList.add('collapsed');
          controllerEl.classList.add('track-faded');

          originatingBtn.classList.add('is-chosen');
          for (var c = 0; c < allCells.length; c++) {
            if (allCells[c] !== originatingBtn) {
              allCells[c].classList.add('is-faded');
            }
          }

          var offset = getChosenOffset(originatingBtn);
          originatingBtn.style.transform = 'translate(' + Math.round(offset.dx) + 'px, ' + Math.round(offset.dy) + 'px)';

          var titleHideDelay = Math.min(branchData.duration * 0.12, 0.9) * 1000;
          setTimeout(function() {
            if (token === currentToken && currentState !== 'base') {
              stageEl.classList.add('title-hidden');
            }
          }, titleHideDelay);

          announce('Transitioning to ' + branchData.name + '...');
        } else {
          // REVERSE: Start reverse clip and expand bar in parallel
          hadFocus = (document.activeElement === originatingBtn);
          isCollapsed = false;

          controllerEl.classList.remove('collapsed');
          controllerEl.classList.remove('track-faded');

          originatingBtn.style.transform = '';
          originatingBtn.classList.remove('is-reset');
          originatingBtn.classList.remove('is-chosen');
          originatingBtn.textContent = branchData.name;
          originatingBtn.removeAttribute('aria-label');

          for (var k = 0; k < allCells.length; k++) {
            allCells[k].classList.remove('is-faded');
          }

          setCapsuleIndex(0);
          announce('Returning to base scene...');
        }

        // Step 2 & 3: Keep previous video visible and paused; prepare target video at 0
        if (previousVideo) {
          try {
            previousVideo.pause();
          } catch (e) {}
        }

        var pausableTimer = null;
        var frameWaiter = null;
        var monitorHandle = null;

        prepareTargetVideo(targetVideo, token).then(function() {
          if (token !== currentToken) return;

          // Step 4: Register first-frame callback BEFORE calling play()
          frameWaiter = waitForDecodedFrame(targetVideo, token);

          var playPromise = targetVideo.play();

          pausableTimer = createPausableTimeout(targetVideo, function() {
            if (token === currentToken) {
              handleTransitionError(branchKey, direction, new Error('First frame timeout'), hadFocus);
            }
          }, 12000);

          return Promise.all([playPromise, frameWaiter.promise]);
        }).then(function() {
          if (token !== currentToken) return;

          if (pausableTimer) pausableTimer.clear();

          // Step 7: Switch visibility atomically. Never crossfade two different scene states.
          targetVideo.style.visibility = 'visible';
          if (previousVideo && previousVideo !== targetVideo) {
            previousVideo.style.visibility = 'hidden';
            try {
              previousVideo.pause();
            } catch (e) {}
          }
          currentVisibleVideo = targetVideo;

          // Step 8: Monitor only active video near hold time
          var targetDuration = (direction === 'forward') ? branchData.duration : branchData.revDuration;
          var holdGuard = (direction === 'forward') ? branchData.holdGuardFwd : branchData.holdGuardRev;

          monitorHandle = monitorPlayback(targetVideo, targetDuration, holdGuard, token, function() {
            if (token !== currentToken) return;

            // Commit scene state and update semantics
            if (direction === 'forward') {
              currentState = branchKey;
              isLocked = false;

              originatingBtn.textContent = 'Reset';
              originatingBtn.classList.add('is-reset');
              originatingBtn.disabled = false;
              originatingBtn.removeAttribute('aria-disabled');
              originatingBtn.setAttribute('aria-label', 'Reset to base scene');

              for (var ob = 0; ob < allButtons.length; ob++) {
                if (allButtons[ob] !== originatingBtn) {
                  allButtons[ob].disabled = true;
                  allButtons[ob].setAttribute('aria-hidden', 'true');
                  allButtons[ob].setAttribute('tabindex', '-1');
                }
              }

              if (hadFocus) {
                try {
                  originatingBtn.focus({ preventScroll: true });
                } catch (e) {}
              }

              announce(branchData.name + ' scene selected. Reset available.');
            } else {
              // Commit base state
              currentState = 'base';
              activeBranch = null;
              activeBtn = null;
              isLocked = false;

              stageEl.classList.remove('title-hidden');

              for (var rb = 0; rb < allButtons.length; rb++) {
                var bBranch = allButtons[rb].getAttribute('data-branch');
                allButtons[rb].removeAttribute('aria-hidden');
                allButtons[rb].setAttribute('tabindex', '0');
                if (branches[bBranch] && branches[bBranch].fwdReady && branches[bBranch].revReady) {
                  allButtons[rb].disabled = false;
                  allButtons[rb].removeAttribute('aria-disabled');
                }
              }

              if (hadFocus) {
                try {
                  originatingBtn.focus({ preventScroll: true });
                } catch (e) {}
              }

              announce('Base scene active.');
            }
          });
        }).catch(function(err) {
          if (pausableTimer) pausableTimer.clear();
          if (frameWaiter) frameWaiter.cancel();
          if (monitorHandle) monitorHandle.cancel();
          handleTransitionError(branchKey, direction, err, hadFocus);
        });
      }

      function handleTransitionError(branchKey, direction, err, hadFocus) {
        lastFailedTransition = { branch: branchKey, direction: direction };
        isLocked = false;

        // Restore bar if failed during forward collapse
        if (direction === 'forward') {
          isCollapsed = false;
          controllerEl.classList.remove('collapsed');
          controllerEl.classList.remove('track-faded');
          stageEl.classList.remove('title-hidden');

          for (var c = 0; c < allCells.length; c++) {
            allCells[c].classList.remove('is-faded');
            allCells[c].style.transform = '';
            allCells[c].classList.remove('is-chosen');
            allCells[c].classList.remove('is-reset');
          }

          var originatingBtn = document.getElementById(branches[branchKey].btnId);
          if (originatingBtn) {
            originatingBtn.textContent = branches[branchKey].name;
          }

          setCapsuleIndex(0);
          currentState = 'base';
          activeBranch = null;
          activeBtn = null;
        }

        // Re-enable ready buttons
        for (var b = 0; b < allButtons.length; b++) {
          var bBranch = allButtons[b].getAttribute('data-branch');
          allButtons[b].removeAttribute('aria-hidden');
          allButtons[b].setAttribute('tabindex', '0');
          if (branches[bBranch] && branches[bBranch].fwdReady && branches[bBranch].revReady) {
            allButtons[b].disabled = false;
            allButtons[b].removeAttribute('aria-disabled');
          }
        }

        if (noticeEl) {
          noticeTextEl.textContent = 'Transition failed to load.';
          noticeEl.hidden = false;
        }

        announce('Error loading scene transition. Press retry to try again.');
      }

      if (noticeRetryBtn) {
        noticeRetryBtn.addEventListener('click', function() {
          if (noticeEl) noticeEl.hidden = true;
          if (lastFailedTransition) {
            runTransition(lastFailedTransition.branch, lastFailedTransition.direction);
          }
        });
      }

      // ══════════════════════════════════════════════════════════════════
      // Button Click Handler & Flow Dispatch
      // ══════════════════════════════════════════════════════════════════
      for (var i = 0; i < allButtons.length; i++) {
        (function(btn) {
          btn.addEventListener('click', function() {
            if (isLocked) return;

            var branchKey = btn.getAttribute('data-branch');

            if (currentState === 'base') {
              runTransition(branchKey, 'forward');
            } else if (currentState === branchKey) {
              runTransition(branchKey, 'reverse');
            }
          });
        })(allButtons[i]);
      }

      // ══════════════════════════════════════════════════════════════════
      // Initial Load & Readiness Tracking
      // ══════════════════════════════════════════════════════════════════
      function checkPairReadiness(branchKey) {
        var b = branches[branchKey];
        if (!b) return;
        if (b.fwdReady && b.revReady) {
          var btn = document.getElementById(b.btnId);
          if (btn && !isLocked && currentState === 'base') {
            btn.disabled = false;
            btn.removeAttribute('aria-disabled');
          }
        }
      }

      function registerMediaReadiness(video, branchKey, isFwd) {
        function markReady() {
          if (isFwd) {
            branches[branchKey].fwdReady = true;
          } else {
            branches[branchKey].revReady = true;
          }
          checkPairReadiness(branchKey);
        }

        if (video.readyState >= 2) {
          markReady();
        } else {
          video.addEventListener('loadeddata', function onLoaded() {
            video.removeEventListener('loadeddata', onLoaded);
            markReady();
          });
          video.addEventListener('canplay', function onCanPlay() {
            video.removeEventListener('canplay', onCanPlay);
            markReady();
          });
        }
      }

      for (var key in branches) {
        if (Object.prototype.hasOwnProperty.call(branches, key)) {
          var fwdVid = document.getElementById(branches[key].fwdId);
          var revVid = document.getElementById(branches[key].revId);
          if (fwdVid) registerMediaReadiness(fwdVid, key, true);
          if (revVid) registerMediaReadiness(revVid, key, false);
        }
      }

      // Base scene parking: video-1.mp4 at frame 0
      var baseVideo = document.getElementById('vid-clothing-fwd');
      if (baseVideo) {
        baseVideo.currentTime = 0;
        try {
          baseVideo.pause();
        } catch (e) {}

        var revealBase = function() {
          baseVideo.style.visibility = 'visible';
          currentVisibleVideo = baseVideo;
          announce('Scene ready.');
        };

        if (baseVideo.readyState >= 2) {
          revealBase();
        } else {
          baseVideo.addEventListener('loadeddata', function onBaseData() {
            baseVideo.removeEventListener('loadeddata', onBaseData);
            revealBase();
          });
          baseVideo.addEventListener('canplay', function onBaseCanPlay() {
            baseVideo.removeEventListener('canplay', onBaseCanPlay);
            revealBase();
          });
        }
      }

    })();
  </script>
</body>
</html>
